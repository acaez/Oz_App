<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OZ Library — Verify Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="/shared/config.js"></script>
  <script src="/shared/api.js"></script>
  <script defer src="verify.js"></script>
</head>

<body>

  <div class="scene">
    <div class="card card-reset">

      <div class="card-back" style="transform: none; pointer-events: auto;">
        <div class="back-view active">
          <div class="verify-content">
            <svg class="verify-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <path d="M2 7l10 7 10-7"/>
            </svg>
            <h2 class="form-title" id="verifyTitle">Verifying…</h2>
            <p class="verify-text" id="verifyText">Please wait a moment.</p>
            <a href="/auth/" class="btn-action" style="display:block; text-align:center; text-decoration:none; padding: 13px 0; margin-top: 8px;">Log in</a>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
