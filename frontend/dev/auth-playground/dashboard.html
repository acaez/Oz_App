<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Test Frontend</title>
  <script defer src="app.js"></script>
</head>
<body>

  <h1>Dashboard</h1>
  <p id="userInfo">Chargement...</p>
  <button id="logoutBtn">Logout</button>

  <hr>

  <!-- ── 2FA SETUP ─────────────────────────────────────────────────────────── -->
  <section id="tfaSetupSection">
    <h2>Activer la 2FA</h2>
    <button id="setup2FABtn">Générer QR Code</button>
    <div id="qrSection" style="display:none">
      <img id="qrImg" alt="QR Code">
      <p>Clé manuelle : <strong id="tfaSecret"></strong></p>
      <form id="activateForm">
        <input type="text" name="code" placeholder="Code de confirmation (6 chiffres)" maxlength="6" required>
        <button type="submit">Activer</button>
      </form>
      <p id="activateMsg"></p>
    </div>
  </section>

  <hr>

  <!-- ── 2FA DISABLE ───────────────────────────────────────────────────────── -->
  <section>
    <h2>Désactiver la 2FA</h2>
    <form id="disableForm">
      <input type="password" name="password" placeholder="Mot de passe actuel" required><br>
      <input type="text"     name="code"     placeholder="Code TOTP (6 chiffres)" maxlength="6" required><br>
      <button type="submit">Désactiver</button>
    </form>
    <p id="disableMsg"></p>
  </section>

  <script>
    function msg(id, text, isError) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.style.color = isError ? 'red' : 'green';
    }

    // Vérifier l'auth au chargement
    async function init() {
      try {
        const user = await getMe();
        document.getElementById('userInfo').textContent =
          `Connecté : ${user.name} (${user.email}) — 2FA: ${user.two_fa_enabled ? 'activée' : 'désactivée'}`;
      } catch {
        window.location.href = 'index.html'; // non authentifié → retour login
      }
    }
    init();

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await logout();
      window.location.href = 'index.html';
    });

    // Setup 2FA
    document.getElementById('setup2FABtn').addEventListener('click', async () => {
      try {
        const { qrCode, secret } = await setup2FA();
        document.getElementById('qrImg').src     = qrCode;
        document.getElementById('tfaSecret').textContent = secret;
        document.getElementById('qrSection').style.display = 'block';
      } catch (err) { alert(err.message); }
    });

    // Activate 2FA
    document.getElementById('activateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await activate2FA(e.target.code.value);
        msg('activateMsg', res.message, false);
      } catch (err) { msg('activateMsg', err.message, true); }
    });

    // Disable 2FA
    document.getElementById('disableForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await disable2FA(e.target.password.value, e.target.code.value);
        msg('disableMsg', res.message, false);
      } catch (err) { msg('disableMsg', err.message, true); }
    });
  </script>

</body>
</html>
