<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth — Test Frontend</title>
  <script defer src="app.js"></script>
</head>
<body>

  <h1>Auth — Test Frontend</h1>
  <p><em>Zone de test locale. Aucun style, juste les formulaires.</em></p>

  <!-- ── REGISTER ─────────────────────────────────────────────────────────── -->
  <section>
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text"     name="pseudo"   placeholder="Pseudo (ex: Xxx_42_xxX)" required><br>
      <input type="email"    name="email"    placeholder="Email"         required><br>
      <input type="password" name="password" placeholder="Password"      required><br>
      <input type="date"     name="dob"      placeholder="Date of birth" required><br>
      <button type="submit">Register</button>
    </form>
    <p id="registerMsg"></p>
  </section>

  <hr>

  <!-- ── LOGIN ────────────────────────────────────────────────────────────── -->
  <section>
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email"    name="email"    placeholder="Email"    required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <p id="loginMsg"></p>
  </section>

  <!-- ── 2FA CODE (affiché si 2FA_REQUIRED) ───────────────────────────────── -->
  <section id="tfaSection" style="display:none">
    <h2>2FA — Code TOTP</h2>
    <form id="tfaForm">
      <input type="text" name="code" placeholder="Code à 6 chiffres" maxlength="6" required><br>
      <button type="submit">Valider</button>
    </form>
    <p id="tfaMsg"></p>
  </section>

  <hr>

  <!-- ── FORGOT PASSWORD ──────────────────────────────────────────────────── -->
  <section>
    <h2>Forgot Password</h2>
    <form id="forgotForm">
      <input type="email" name="email" placeholder="Email" required><br>
      <button type="submit">Send reset link</button>
    </form>
    <p id="forgotMsg"></p>
  </section>

  <hr>

  <!-- ── VERIFY EMAIL ─────────────────────────────────────────────────────── -->
  <section>
    <h2>Verify Email (token depuis l'URL)</h2>
    <button id="verifyBtn">Vérifier le token dans l'URL</button>
    <p id="verifyMsg"></p>
  </section>

  <script>
    function msg(id, text, isError) {
      const el = document.getElementById(id);
      el.textContent  = text;
      el.style.color  = isError ? 'red' : 'green';
    }

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      try {
        const res = await register(f.pseudo.value, f.email.value, f.password.value, f.dob.value);
        msg('registerMsg', res.message, false);
      } catch (err) { msg('registerMsg', err.message, true); }
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      try {
        const res = await login(f.email.value, f.password.value);
        if (res.status === '2FA_REQUIRED') {
          document.getElementById('tfaSection').style.display = 'block';
          msg('loginMsg', '2FA requis — entrez votre code TOTP', false);
        } else {
          msg('loginMsg', `Connecté en tant que ${res.user.pseudo}`, false);
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        }
      } catch (err) { msg('loginMsg', err.message, true); }
    });

    // 2FA verify
    document.getElementById('tfaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await verify2FA(e.target.code.value);
        msg('tfaMsg', `Connecté en tant que ${res.user.pseudo}`, false);
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) { msg('tfaMsg', err.message, true); }
    });

    // Forgot password
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await forgotPassword(e.target.email.value);
        msg('forgotMsg', res.message, false);
      } catch (err) { msg('forgotMsg', err.message, true); }
    });

    // Verify email (token dans l'URL: ?token=xxx)
    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) return msg('verifyMsg', 'Aucun token dans l\'URL (?token=xxx)', true);
      try {
        const res = await verifyEmail(token);
        msg('verifyMsg', res.message, false);
      } catch (err) { msg('verifyMsg', err.message, true); }
    });
  </script>

</body>
</html>
